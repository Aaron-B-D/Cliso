server {
	listen 80;
	root /usr/share/nginx/html;
	index index.html;

	# Los ficheros IFC pueden ser muy grandes: sin límite de cuerpo y sin guardarlos antes en disco.
	client_max_body_size 0;
	proxy_request_buffering off;
	proxy_read_timeout 600s;
	proxy_send_timeout 600s;

	# La API se resuelve en cada petición (DNS de Docker) y no al arrancar: la web puede arrancar sola, sin la API.
	resolver 127.0.0.11 valid=10s ipv6=off;

	# El navegador solo habla con este origen: /api/... se reenvía a la API quitando el prefijo /api.
	location /api/ {
		set $api_upstream http://api:8000;
		rewrite ^/api/(.*)$ /$1 break;
		proxy_pass $api_upstream;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Documentación de la API (Swagger UI y ReDoc): la página pide /openapi.json en la raíz, así que va sin prefijo.
	location ~ ^/(docs|redoc|openapi\.json)$ {
		set $api_upstream http://api:8000;
		proxy_pass $api_upstream;
		proxy_set_header Host $host;
	}

	# Aplicación de una sola página: cualquier ruta desconocida devuelve index.html.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
