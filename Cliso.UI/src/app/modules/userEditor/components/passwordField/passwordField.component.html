<mat-form-field class="userEditorPasswordFieldDir" appearance="outline" subscriptSizing="dynamic">
	<mat-label>{{ Label }}</mat-label>
	<!-- new-password: el navegador no debe rellenarlo con la contraseña de quien edita -->
	<input matInput autocomplete="new-password"
		[appInvalid]="IsInvalid"
		[ngModel]="Value"
		[type]="InputType"
		(ngModelChange)="OnValueChanged($event)"
	/>
	<button matSuffix mat-icon-button type="button"
		matTooltip="{{ ToggleText }}"
		[attr.aria-label]="ToggleText"
		(click)="OnVisibilityClicked()"
	>
		<img class="uepf_icon" alt="" [src]="ToggleIcon" />
	</button>
</mat-form-field>
