<section class="userEditorPasswordDialogDir">
	<h2 mat-dialog-title>{{ TITLE_TEXT }}</h2>
	<div class="uepd_fields" mat-dialog-content>
		<app-user-editor-password-field
			[Label]="PASSWORD_TEXT"
			[Value]="Password"
			(valueChanged)="OnPasswordChanged($event)"
		></app-user-editor-password-field>
		@if (PasswordError) {
			<p class="uepd_error" role="alert">{{ FIELD_REQUIRED_TEXT }}</p>
		}
		<app-user-editor-password-field
			[Label]="PASSWORD_REPEAT_TEXT"
			[Value]="PasswordRepeat"
			(valueChanged)="OnPasswordRepeatChanged($event)"
		></app-user-editor-password-field>
		@if (PasswordMismatchError) {
			<p class="uepd_error" role="alert">{{ PASSWORD_MISMATCH_TEXT }}</p>
		}
	</div>
	<footer class="uepd_actions" mat-dialog-actions>
		<button mat-stroked-button type="button"
			(click)="OnCancelClicked()"
		>{{ CANCEL_TEXT }}</button>
		<button mat-flat-button type="button"
			(click)="OnAcceptClicked()"
		>{{ ACCEPT_TEXT }}</button>
	</footer>
</section>
