<mat-form-field class="numberPanelDir" appearance="outline" subscriptSizing="dynamic">
	<mat-label>{{ Label }}</mat-label>
	<input matInput type="number" step="1"
		[attr.max]="Max"
		[attr.min]="Min"
		[value]="Value"
		[appReadOnly]="IsReadOnly"
		(change)="OnChange($event)"
		(input)="OnInput($event)"
	/>
</mat-form-field>
