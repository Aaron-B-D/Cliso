<aside class="sidebarDir">
	<header class="sid_bar d-md-none">
		<button mat-icon-button matTooltip="{{ MENU_TEXT }}" [attr.aria-label]="MENU_TEXT" [matMenuTriggerFor]="mobileMenu">
			<img class="sid_icon" [src]="MenuIcon" alt="" />
		</button>
		<mat-menu #mobileMenu="matMenu">
			<a mat-menu-item class="sid_menu_option" [routerLink]="HomeRoute">
				<span class="sid_menu_content">
					<img class="sid_icon" [src]="HomeIcon" alt="" />
					<span>{{ HOME_TEXT }}</span>
				</span>
			</a>
			<button mat-menu-item class="sid_menu_option" [attr.aria-expanded]="IsEditionExpanded" (click)="OnEditionToggleClicked($event)">
				<span class="sid_menu_content">
					<img class="sid_icon" [src]="EditionIcon" alt="" />
					<span>{{ EDITION_TEXT }}</span>
				</span>
			</button>
			@if (IsEditionExpanded) {
				<button mat-menu-item class="sid_menu_option sid_menu_option-nested" (click)="OnBimModelsClicked()">{{ MODELS_TEXT }}</button>
				<button mat-menu-item disabled class="sid_menu_option sid_menu_option-nested">{{ VISUALIZATIONS_TEXT }}</button>
				<button mat-menu-item disabled class="sid_menu_option sid_menu_option-nested">{{ USERS_TEXT }}</button>
			}
			<button mat-menu-item disabled class="sid_menu_option">
				<span class="sid_menu_content">
					<img class="sid_icon" [src]="UserIcon" alt="" />
					<span>{{ UserName }}</span>
				</span>
			</button>
		</mat-menu>
	</header>
	<nav class="sid_nav d-none d-md-flex">
		<mat-nav-list class="sid_menu">
			<a
				mat-list-item
				routerLinkActive
				class="sid_menu_item"
				#homeLink="routerLinkActive"
				[attr.aria-label]="HOME_TEXT"
				[activated]="homeLink.isActive"
				[routerLink]="HomeRoute"
			>
				<img matListItemIcon [src]="HomeIcon" alt="" />
				<span matListItemTitle>{{ HOME_TEXT }}</span>
			</a>
			<button
				mat-list-item
				cdkOverlayOrigin
				class="sid_menu_item"
				#editionOrigin="cdkOverlayOrigin"
				[activated]="IsEditionPanelOpen"
				[attr.aria-expanded]="IsEditionPanelOpen"
				[attr.aria-label]="EDITION_TEXT"
				(click)="OnEditionPanelToggled()"
			>
				<img matListItemIcon [src]="EditionIcon" alt="" />
				<span matListItemTitle>{{ EDITION_TEXT }}</span>
			</button>
			<ng-template
				cdkConnectedOverlay
				cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
				[cdkConnectedOverlayHasBackdrop]="true"
				[cdkConnectedOverlayOpen]="IsEditionPanelOpen"
				[cdkConnectedOverlayOrigin]="editionOrigin"
				[cdkConnectedOverlayPositions]="EditionPanelPositions"
				(backdropClick)="OnEditionPanelClosed()"
				(overlayKeydown)="OnEditionPanelKeyDown($event)"
			>
				<mat-action-list class="sid_panel floating-panel">
					<button class="sid_panel_item" mat-list-item (click)="OnBimModelsClicked()">{{ MODELS_TEXT }}</button>
					<button class="sid_panel_item" mat-list-item disabled>{{ VISUALIZATIONS_TEXT }}</button>
					<button class="sid_panel_item" mat-list-item disabled>{{ USERS_TEXT }}</button>
				</mat-action-list>
			</ng-template>
		</mat-nav-list>
		<footer class="sid_user" matTooltip="{{ UserName }}">
			<img class="sid_user_icon" [src]="UserIcon" alt="" />
			<span class="sid_user_name">{{ UserName }}</span>
		</footer>
	</nav>
</aside>
