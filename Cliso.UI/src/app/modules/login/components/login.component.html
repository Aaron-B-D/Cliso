<main class="loginDir">
	<section class="log_card">
		<h1 class="log_title">{{ Title }}</h1>
		<mat-form-field appearance="outline" subscriptSizing="dynamic">
			<mat-label>{{ LanguageText }}</mat-label>
			<mat-select
				[value]="SelectedLanguage"
				(selectionChange)="OnLanguageChanged($event)"
			>
				@for (option of Options; track option.Code) {
					<mat-option [value]="option.Code">{{ option.Name }}</mat-option>
				}
			</mat-select>
		</mat-form-field>
		<form class="log_form" (ngSubmit)="OnSubmit()">
			<mat-form-field appearance="outline" subscriptSizing="dynamic">
				<mat-label>{{ NickText }}</mat-label>
				<input matInput name="nick" autocomplete="username" required [(ngModel)]="Nick" />
			</mat-form-field>
			<mat-form-field appearance="outline" subscriptSizing="dynamic">
				<mat-label>{{ PasswordText }}</mat-label>
				<input matInput type="password" name="password" autocomplete="current-password" required [(ngModel)]="Password" />
			</mat-form-field>
			<p class="log_error" role="alert">{{ ErrorText }}</p>
			<button mat-flat-button class="log_submit" type="submit" [disabled]="IsLoading">{{ SubmitText }}</button>
		</form>
	</section>
</main>
